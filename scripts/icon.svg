<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Roofy mark: a roof pitch line over a steel-tape tick row, ink on tape (DESIGN.md tokens: tape #ffc82c, ink #2f3133).
       Full-bleed background; the mark stays inside the central 80% circle so the same art works as a maskable icon. -->
  <rect width="512" height="512" fill="#ffc82c"/>
  <polyline points="106,290 256,150 406,290" fill="none" stroke="#2f3133" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="106" y1="340" x2="406" y2="340" stroke="#2f3133" stroke-width="12" stroke-linecap="round"/>
  <g stroke="#2f3133" stroke-width="12" stroke-linecap="round">
    <line x1="106" y1="340" x2="106" y2="364"/>
    <line x1="136" y1="340" x2="136" y2="364"/>
    <line x1="166" y1="340" x2="166" y2="364"/>
    <line x1="196" y1="340" x2="196" y2="364"/>
    <line x1="226" y1="340" x2="226" y2="364"/>
    <line x1="256" y1="340" x2="256" y2="388"/>
    <line x1="286" y1="340" x2="286" y2="364"/>
    <line x1="316" y1="340" x2="316" y2="364"/>
    <line x1="346" y1="340" x2="346" y2="364"/>
    <line x1="376" y1="340" x2="376" y2="364"/>
    <line x1="406" y1="340" x2="406" y2="364"/>
  </g>
</svg>
